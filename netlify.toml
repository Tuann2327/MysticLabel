[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Pinned explicitly so `netlify dev` always fronts the Vite server on 3000 at
# port 8888, rather than guessing the framework and port.
[dev]
  command    = "npm run dev"
  targetPort = 3000
  port       = 8888
  framework  = "#custom"
  autoLaunch = false

[build.environment]
  # 22+ is required by @netlify/blobs (picking-list share links). Node 18 is also
  # past end-of-life, and Netlify's own default for new sites is now 22.
  NODE_VERSION = "22"

[[redirects]]
  from   = "/shopify-proxy/*"
  to     = "/.netlify/functions/shopify-proxy/:splat"
  status = 200
  force  = true

# Short picking-list links: /l/<id> serves the standalone page, which reads the
# id out of its own path. The /api/* endpoints declare their own paths via the
# `config` export in each function, so they need no redirect here.
# force is required: under `netlify dev` the Vite server answers every unmatched
# path with index.html, which counts as a match and would skip a soft rewrite.
[[redirects]]
  from   = "/l/*"
  to     = "/list.html"
  status = 200
  force  = true
